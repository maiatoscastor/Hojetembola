[versions]
agp                 = "9.0.1"
kotlin              = "2.2.20"
coreKtx             = "1.18.0"
junit               = "4.13.2"
junitVersion        = "1.3.0"
espressoCore        = "3.7.0"
appcompat           = "1.7.1"
material            = "1.13.0"
activity            = "1.13.0"
constraintlayout    = "2.2.1"
hilt                = "2.59.2"
hiltWork            = "1.2.0"
room                = "2.7.0"
workmanager         = "2.9.0"
lifecycle           = "2.7.0"
navigation          = "2.7.7"
glide               = "4.16.0"
coroutines          = "1.7.3"
mockk               = "1.13.10"
googleServices      = "4.4.2"
ksp                 = "2.2.20-2.0.3"

[libraries]
# ─── AndroidX core ───────────────────────────────────────────────────────────
androidx-core-ktx        = { group = "androidx.core",               name = "core-ktx",           version.ref = "coreKtx" }
androidx-appcompat       = { group = "androidx.appcompat",          name = "appcompat",           version.ref = "appcompat" }
material                 = { group = "com.google.android.material",  name = "material",            version.ref = "material" }
androidx-activity        = { group = "androidx.activity",           name = "activity",            version.ref = "activity" }
androidx-constraintlayout= { group = "androidx.constraintlayout",   name = "constraintlayout",   version.ref = "constraintlayout" }

# ─── Room ────────────────────────────────────────────────────────────────────
room-runtime             = { group = "androidx.room",               name = "room-runtime",        version.ref = "room" }
room-ktx                 = { group = "androidx.room",               name = "room-ktx",            version.ref = "room" }
room-compiler            = { group = "androidx.room",               name = "room-compiler",       version.ref = "room" }
room-testing             = { group = "androidx.room",               name = "room-testing",        version.ref = "room" }

# ─── WorkManager ─────────────────────────────────────────────────────────────
work-runtime-ktx         = { group = "androidx.work",              name = "work-runtime-ktx",    version.ref = "workmanager" }

# ─── Lifecycle ───────────────────────────────────────────────────────────────
lifecycle-viewmodel-ktx  = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-livedata-ktx   = { group = "androidx.lifecycle",          name = "lifecycle-livedata-ktx",  version.ref = "lifecycle" }

# ─── Navigation ──────────────────────────────────────────────────────────────
navigation-fragment-ktx  = { group = "androidx.navigation",         name = "navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx        = { group = "androidx.navigation",         name = "navigation-ui-ktx",       version.ref = "navigation" }

# ─── Hilt (Dagger) ───────────────────────────────────────────────────────────
hilt-android             = { group = "com.google.dagger",           name = "hilt-android",            version.ref = "hilt" }
hilt-compiler            = { group = "com.google.dagger",           name = "hilt-android-compiler",   version.ref = "hilt" }

# ─── Hilt extensions (WorkManager + ViewModel) ───────────────────────────────
hilt-work                = { group = "androidx.hilt",               name = "hilt-work",               version.ref = "hiltWork" }
hilt-androidx-compiler   = { group = "androidx.hilt",               name = "hilt-compiler",           version.ref = "hiltWork" }

# ─── Glide ───────────────────────────────────────────────────────────────────
glide                    = { group = "com.github.bumptech.glide",   name = "glide",                   version.ref = "glide" }

# ─── Coroutines ──────────────────────────────────────────────────────────────
coroutines-android       = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test          = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",    version.ref = "coroutines" }

# ─── Testes ──────────────────────────────────────────────────────────────────
junit                    = { group = "junit",                       name = "junit",                   version.ref = "junit" }
androidx-junit           = { group = "androidx.test.ext",           name = "junit",                   version.ref = "junitVersion" }
androidx-espresso-core   = { group = "androidx.test.espresso",      name = "espresso-core",           version.ref = "espressoCore" }
mockk                    = { group = "io.mockk",                    name = "mockk",                   version.ref = "mockk" }

[plugins]
android-application      = { id = "com.android.application",                    version.ref = "agp" }
ksp                      = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
hilt-android             = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
google-services          = { id = "com.google.gms.google-services",             version.ref = "googleServices" }
kotlin-serialization     = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
