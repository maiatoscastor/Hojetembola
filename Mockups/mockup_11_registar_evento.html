<!doctype html><html lang='pt'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Registar Evento</title><style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    :root{
      --bg-page:#060E1F;--bg-primary:#0D1B3E;--bg-surface:#162448;--bg-border:#1E3260;
      --orange:#F57C00;--green:#4CAF50;--text-primary:#fff;--text-secondary:#8A9BB8;--text-muted:#4A5C7A;
    }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg-page);font-family:'Poppins',sans-serif;color:var(--text-primary)}
    .phone{width:300px;height:620px;background:var(--bg-primary);border:2px solid var(--bg-border);border-radius:36px;overflow:hidden;position:relative}
    .phone.landscape{width:580px;height:300px}
    .status{display:flex;justify-content:space-between;padding:10px 18px 4px;font-size:10px;color:var(--text-secondary)}
    .content{height:calc(100% - 26px);padding:10px 14px 14px;overflow-y:auto}
    .content::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:3px}.content::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:#1E3260;border-radius:2px}
    .content,.scroll{scrollbar-width:thin;scrollbar-color:#1E3260 transparent}
    .card{background:var(--bg-surface);border:1.5px solid var(--bg-border);border-radius:12px;padding:12px 14px}
    .title{font-size:17px;font-weight:700}.sub{font-size:12px;color:var(--text-secondary)}
    .btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--orange);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
    .btn.green{background:var(--green)}
    .btn.secondary{background:var(--bg-surface);border:1.5px solid var(--bg-border);color:var(--text-secondary)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:8px}.gap8{display:grid;gap:8px}.gap10{display:grid;gap:10px}.gap12{display:grid;gap:12px}
    .badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600}
    .live{background:var(--orange);color:#fff}.open{border:1px solid var(--green);color:var(--green);background:var(--bg-primary)}.done{background:var(--bg-border);color:var(--text-secondary)}
    .tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
    .tab,.chip{padding:7px 10px;border-radius:10px;background:var(--bg-surface);border:1.5px solid var(--bg-border);color:var(--text-secondary);font-size:11px;cursor:pointer}
    .tab.active,.chip.active{border-color:var(--orange);color:var(--orange);background:var(--bg-primary)}
    .fade{animation:fadeIn .35s ease}
    @keyframes fadeIn{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    input,select,textarea{width:100%;padding:10px 12px;background:var(--bg-surface);border:1.5px solid var(--bg-border);border-radius:10px;color:#fff;font-size:12px;font-family:'Poppins',sans-serif}
    input::placeholder,textarea::placeholder{color:var(--text-muted)}
    .nav{position:absolute;left:0;right:0;bottom:0;border-top:1.5px solid var(--bg-border);padding:10px 0 14px;display:flex;justify-content:space-around;background:var(--bg-primary)}
    .nav span{font-size:9px;color:var(--text-muted)}.nav .active{color:var(--orange)}
    .avatar{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:8px;font-weight:700}
    .progress{height:3px;background:var(--bg-primary);border-radius:2px;overflow:hidden}.fill{height:100%;background:var(--orange)}.ic{width:12px;height:12px;display:inline-block;vertical-align:-2px;margin-right:4px;color:#F57C00}.rank-badge{display:inline-block;min-width:22px;padding:1px 6px;border-radius:10px;font-size:9px;font-weight:700;color:#fff;margin-right:6px;text-align:center}.rank-badge.gold{background:#EF9F27}.rank-badge.silver{background:#378ADD}.rank-badge.bronze{background:#D85A30}
    /* Ícones por tipo de evento (chips) */
    .chip[data-event='amarelo'] .ic{color:#F5C84C}
    .chip[data-event='vermelho'] .ic{color:#F05B5B}
    .chip[data-event='golo'] .ic{color:#F57C00}
    .chip[data-event='penalti'] .ic{color:#4CAF50}
    .chip[data-event='substituicao'] .ic{color:#8A9BB8}
    /* Base do ecrã por trás (igual ao Jogo Ao Vivo) */
    .score-shell{border-color:#F57C00;text-align:center;padding:10px 10px}
    .score-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .score-mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
    .team-name{font-size:18px;font-weight:700;line-height:1.15}
    .score-number{font-size:40px;font-weight:700;letter-spacing:.02em;line-height:1}
    .score-sep{font-size:26px;font-weight:600;color:#8A9BB8;padding:0 4px}
    .timeline-head{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;margin-bottom:8px}
    .timeline-head .side{font-size:10px;color:#8A9BB8;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
    .timeline-head .side.right{text-align:right}
    .timeline-split{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px}
    .event-col{display:grid;gap:7px}
    .event-item{background:#0F2048;border:1px solid #1E3260;border-radius:8px;padding:6px}
    .event-time{font-size:10px;color:#F57C00;font-weight:600}
    .event-text{font-size:11px;color:#8A9BB8;line-height:1.3}
    .event-sep{display:grid;gap:7px;justify-items:center}
    .event-sep div{width:2px;height:28px;background:#1E3260;border-radius:2px}
    .event-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-right:5px;vertical-align:-3px}
    .event-icon svg{width:14px;height:14px}
    .icon-goal{color:#F57C00}
    .icon-pen{color:#4CAF50}
    .icon-yellow{color:#F5C84C}
    .icon-red{color:#F05B5B}
    .icon-sub{color:#8A9BB8}
    .form-grid{display:grid;gap:8px}
    .assist-row{display:none}
    .assist-row.show{display:block}
</style></head><body><div class='phone'><div class='status'><span>9:41</span><span>●●●</span></div>
<div class='content' style='position:relative;padding:0'>
  <div style='height:290px;padding:10px 14px' class='gap10'>
    <div class='row'><div class='sub'>Torneio Verão 2025 · Jornada 4</div><span class='badge live'>AO VIVO</span></div>
    <div class='card score-shell'>
      <div class='score-top'><span class='pill' style='border-color:#F57C00;color:#F57C00;font-weight:700'>47:18 · 2ª Parte</span><span class='sub'>Campo da Várzea</span></div>
      <div class='score-mid'>
        <div class='team-name'>FC<br>Malcata</div>
        <div class='row' style='justify-content:center;gap:6px'><span class='score-number'>2</span><span class='score-sep'>—</span><span class='score-number'>1</span></div>
        <div class='team-name' style='text-align:right'>Os<br>Putos</div>
      </div>
      <div class='sub' style='margin-top:6px'>Viana do Castelo · Votação MVP aberta</div>
    </div>
    <div class='card' style='padding:8px 10px'><div class='sub'>Formato</div><b>Liga · Fut7</b></div>
    <div class='card scroll' style='max-height:110px;overflow-y:auto;padding:10px'>
      <div class='timeline-head'><span class='side'>FC Malcata</span><span class='sub' style='text-align:center'>•</span><span class='side right'>Os Putos</span></div>
      <div class='timeline-split'>
        <div class='event-col'>
          <div class='event-item'><div class='event-time'>47'</div><div class='event-text'><span class='event-icon icon-pen'><svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='9' fill='none' stroke='currentColor' stroke-width='2'/><path d='M10 8h3.2a2.7 2.7 0 010 5.4H10V16H8V8z' fill='currentColor'/></svg></span>João M.</div></div>
          <div class='event-item'><div class='event-time'>28'</div><div class='event-text'><span class='event-icon icon-sub'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M7 7h8l-2-2M17 17H9l2 2' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M17 7a5 5 0 010 10M7 17a5 5 0 010-10' fill='none' stroke='currentColor' stroke-width='2'/></svg></span>Rui F. → Nuno T.</div></div>
        </div>
        <div class='event-sep'><div></div><div></div></div>
        <div class='event-col'>
          <div class='event-item'><div class='event-time'>32'</div><div class='event-text'><span class='event-icon icon-yellow'><svg viewBox='0 0 24 24' aria-hidden='true'><rect x='6' y='5' width='12' height='14' rx='2' fill='currentColor'/></svg></span>Pedro S.</div></div>
          <div class='event-item'><div class='event-time'>11'</div><div class='event-text'><span class='event-icon icon-goal'><svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='9' fill='none' stroke='currentColor' stroke-width='2'/><path d='M12 7l3 2-1 3h-4l-1-3 3-2z' fill='currentColor'/></svg></span>Diogo R. (assist. Pedro S.)</div></div>
        </div>
      </div>
    </div>
  </div>
  <div class='card fade' style='position:absolute;left:0;right:0;bottom:0;border-radius:20px 20px 0 0;border:1.5px solid #1E3260;padding:12px 14px'>
    <div style='width:44px;height:4px;background:#4A5C7A;border-radius:4px;margin:0 auto 10px'></div>
    <div class='title'>Registar evento</div>
    <div class='chips' style='margin:8px 0'>
      <button class='chip active' data-event='golo'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='9' fill='none' stroke='currentColor' stroke-width='2'/><path d='M12 7l3 2-1 3h-4l-1-3 3-2z' fill='currentColor'/></svg> Golo</button>
      <button class='chip' data-event='penalti'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='9' fill='none' stroke='currentColor' stroke-width='2'/><path d='M10 8h3.2a2.7 2.7 0 010 5.4H10V16H8V8z' fill='currentColor'/></svg> Golo penálti</button>
      <button class='chip' data-event='amarelo'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><rect x='6' y='5' width='12' height='14' rx='2' fill='currentColor'/></svg> Amarelo</button>
      <button class='chip' data-event='vermelho'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><rect x='6' y='5' width='12' height='14' rx='2' fill='currentColor'/></svg> Vermelho</button>
      <button class='chip' data-event='substituicao'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><path d='M7 7h8l-2-2M17 17H9l2 2' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M17 7a5 5 0 010 10M7 17a5 5 0 010-10' fill='none' stroke='currentColor' stroke-width='2'/></svg> Substituição</button>
    </div>
    <div class='form-grid'><input placeholder='Minuto'><select><option>Jogador</option><option>João M.</option></select><div class='assist-row show' id='assistRow'><select><option>Jogador que assistiu (opcional)</option><option>Gonçalo Teixeira</option><option>Pedro S.</option></select></div><select><option>Equipa</option><option>FC Malcata</option><option>Os Putos</option></select><button class='btn'>Confirmar</button></div>
  </div>
</div>
</div>
<script>
function sendPrompt(target){ if(target) location.href = target; }
document.querySelectorAll('.tabs').forEach(group=>{
  group.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{
    group.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const panelId=tab.dataset.panel; if(!panelId) return;
    const wrap=group.parentElement.querySelector('.tab-panels');
    if(!wrap) return;
    wrap.querySelectorAll('[data-tab]').forEach(p=>p.style.display='none');
    const panel=wrap.querySelector('[data-tab="'+panelId+'"]');
    if(panel){panel.style.display='block';panel.classList.remove('fade');void panel.offsetWidth;panel.classList.add('fade');}
  });
});
document.querySelectorAll('.chips').forEach(group=>{
  group.querySelectorAll('.chip').forEach(chip=>chip.onclick=()=>{
    group.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    const assistRow=document.getElementById('assistRow');
    if(assistRow){
      const showAssist = chip.dataset.event === 'golo';
      assistRow.classList.toggle('show', showAssist);
    }
  });
});
</script>
</body></html>
