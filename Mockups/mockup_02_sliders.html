<!doctype html><html lang='pt'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Sliders</title><style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    :root{
      --bg-page:#060E1F;--bg-primary:#0D1B3E;--bg-surface:#162448;--bg-border:#1E3260;
      --orange:#F57C00;--green:#4CAF50;--text-primary:#fff;--text-secondary:#8A9BB8;--text-muted:#4A5C7A;
    }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg-page);font-family:'Poppins',sans-serif;color:var(--text-primary)}
    .phone{width:300px;height:620px;background:var(--bg-primary);border:2px solid var(--bg-border);border-radius:36px;overflow:hidden;position:relative}
    .phone.landscape{width:580px;height:300px}
    .status{display:flex;justify-content:space-between;padding:10px 18px 4px;font-size:10px;color:var(--text-secondary)}
    .content{height:calc(100% - 26px);padding:10px 14px 14px;overflow-y:auto}
    .content::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:3px}.content::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:#1E3260;border-radius:2px}
    .content,.scroll{scrollbar-width:thin;scrollbar-color:#1E3260 transparent}
    .card{background:var(--bg-surface);border:1.5px solid var(--bg-border);border-radius:12px;padding:12px 14px}
    .title{font-size:17px;font-weight:700}.sub{font-size:12px;color:var(--text-secondary)}
    .btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--orange);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
    .btn.green{background:var(--green)}
    .btn.secondary{background:var(--bg-surface);border:1.5px solid var(--bg-border);color:var(--text-secondary)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:8px}.gap8{display:grid;gap:8px}.gap10{display:grid;gap:10px}.gap12{display:grid;gap:12px}
    .badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600}
    .live{background:var(--orange);color:#fff}.open{border:1px solid var(--green);color:var(--green);background:var(--bg-primary)}.done{background:var(--bg-border);color:var(--text-secondary)}
    .tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
    .tab,.chip{padding:7px 10px;border-radius:10px;background:var(--bg-surface);border:1.5px solid var(--bg-border);color:var(--text-secondary);font-size:11px;cursor:pointer}
    .tab.active,.chip.active{border-color:var(--orange);color:var(--orange);background:var(--bg-primary)}
    .fade{animation:fadeIn .35s ease}
    @keyframes fadeIn{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    input,select,textarea{width:100%;padding:10px 12px;background:var(--bg-surface);border:1.5px solid var(--bg-border);border-radius:10px;color:#fff;font-size:12px;font-family:'Poppins',sans-serif}
    input::placeholder,textarea::placeholder{color:var(--text-muted)}
    .nav{position:absolute;left:0;right:0;bottom:0;border-top:1.5px solid var(--bg-border);padding:10px 0 14px;display:flex;justify-content:space-around;background:var(--bg-primary)}
    .nav span{font-size:9px;color:var(--text-muted)}.nav .active{color:var(--orange)}
    .avatar{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:8px;font-weight:700}
    .progress{height:3px;background:var(--bg-primary);border-radius:2px;overflow:hidden}.fill{height:100%;background:var(--orange)}.ic{width:12px;height:12px;display:inline-block;vertical-align:-2px;margin-right:4px;color:#F57C00}#slideWrap .ic{width:60px;height:60px;margin-right:0;vertical-align:0;display:block}.rank-badge{display:inline-block;min-width:22px;padding:1px 6px;border-radius:10px;font-size:9px;font-weight:700;color:#fff;margin-right:6px;text-align:center}.rank-badge.gold{background:#EF9F27}.rank-badge.silver{background:#378ADD}.rank-badge.bronze{background:#D85A30}
</style></head><body><div class='phone'><div class='status'><span>9:41</span><span>●●●</span></div>
<div class='content' style='display:grid;grid-template-rows:1fr auto;gap:14px'>
  <div id='slideWrap' class='fade' style='display:grid;place-items:center;text-align:center;align-content:center;gap:12px'>
    <div style='width:130px;height:130px;border-radius:28px;background:#162448;border:1.5px solid #1E3260;display:grid;place-items:center;font-size:46px;color:#F57C00'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><rect x='4' y='5' width='16' height='15' rx='2' fill='none' stroke='currentColor' stroke-width='2'/><path d='M8 3v4M16 3v4M4 10h16' stroke='currentColor' stroke-width='2' stroke-linecap='round'/></svg></div>
    <div style='font-size:20px;font-weight:700'>Organiza os teus torneios</div>
    <div class='sub' style='line-height:1.6'>Liga, eliminatórias ou grupos. Fut5, Fut7, Fut11 ou personalizado.</div>
  </div>
  <div class='gap10'>
    <div id='dots' class='row' style='justify-content:center'><span style='width:24px;height:8px;border-radius:20px;background:#F57C00'></span><span style='width:8px;height:8px;border-radius:50%;background:#1E3260'></span><span style='width:8px;height:8px;border-radius:50%;background:#1E3260'></span><span style='width:8px;height:8px;border-radius:50%;background:#1E3260'></span></div>
    <button class='btn' id='nextBtn'>Seguinte</button>
    <button class='btn secondary' onclick="sendPrompt('mockup_03_login.html')">Saltar introdução</button>
  </div>
</div>
<script>
const slides=[[`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,'Organiza os teus torneios','Liga, eliminatórias ou grupos. Fut5, Fut7, Fut11 ou personalizado.'],[`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7l3 2-1 3h-4l-1-3 3-2z" fill="currentColor"/></svg>`,'Jogos ao vivo','Golos, cartões e substituições em tempo real para todos.'],[`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l2.5 5.1 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z" fill="currentColor"/></svg>`,'Vota no MVP','Jogadores e público votam. Resultados em percentagem.'],[`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9M12 19V5M19 19v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,'Rankings e estatísticas','Golos e jogos por jornada, mês ou época inteira.']];
let i=0;const wrap=document.getElementById('slideWrap');const dots=document.getElementById('dots');
document.getElementById('nextBtn').onclick=()=>{i=(i+1)%4;render(); if(i===3)document.getElementById('nextBtn').textContent='Começar'; if(i===0)document.getElementById('nextBtn').textContent='Seguinte'; if(i===3)document.getElementById('nextBtn').onclick=()=>sendPrompt('mockup_03_login.html');};
function render(){wrap.classList.remove('fade');void wrap.offsetWidth;wrap.classList.add('fade');wrap.innerHTML=`<div style='width:130px;height:130px;border-radius:28px;background:#162448;border:1.5px solid #1E3260;display:grid;place-items:center;font-size:46px;color:#F57C00'>${slides[i][0]}</div><div style='font-size:20px;font-weight:700'>${slides[i][1]}</div><div class='sub' style='line-height:1.6'>${slides[i][2]}</div>`;dots.innerHTML=slides.map((_,idx)=>idx===i?"<span style='width:24px;height:8px;border-radius:20px;background:#F57C00'></span>":"<span style='width:8px;height:8px;border-radius:50%;background:#1E3260'></span>").join('');}
</script>
</div>
<script>
function sendPrompt(target){ if(target) location.href = target; }
document.querySelectorAll('.tabs').forEach(group=>{
  group.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{
    group.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const panelId=tab.dataset.panel; if(!panelId) return;
    const wrap=group.parentElement.querySelector('.tab-panels');
    if(!wrap) return;
    wrap.querySelectorAll('[data-tab]').forEach(p=>p.style.display='none');
    const panel=wrap.querySelector('[data-tab="'+panelId+'"]');
    if(panel){panel.style.display='block';panel.classList.remove('fade');void panel.offsetWidth;panel.classList.add('fade');}
  });
});
document.querySelectorAll('.chips').forEach(group=>{
  group.querySelectorAll('.chip').forEach(chip=>chip.onclick=()=>{
    group.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
  });
});
</script>
</body></html>
