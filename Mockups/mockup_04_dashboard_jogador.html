<!doctype html><html lang='pt'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Dashboard Jogador</title><style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    :root{
      --bg-page:#060E1F;--bg-primary:#0D1B3E;--bg-surface:#162448;--bg-border:#1E3260;
      --orange:#F57C00;--green:#4CAF50;--text-primary:#fff;--text-secondary:#8A9BB8;--text-muted:#4A5C7A;
    }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg-page);font-family:'Poppins',sans-serif;color:var(--text-primary)}
    .phone{width:300px;height:620px;background:var(--bg-primary);border:2px solid var(--bg-border);border-radius:36px;overflow:hidden;position:relative}
    .phone.landscape{width:580px;height:300px}
    .status{display:flex;justify-content:space-between;padding:10px 18px 4px;font-size:10px;color:var(--text-secondary)}
    .content{height:calc(100% - 26px);padding:10px 14px 14px;overflow-y:auto}
    .content::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:3px}.content::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:#1E3260;border-radius:2px}
    .content,.scroll{scrollbar-width:thin;scrollbar-color:#1E3260 transparent}
    .card{background:var(--bg-surface);border:1.5px solid var(--bg-border);border-radius:12px;padding:12px 14px}
    .title{font-size:17px;font-weight:700}.sub{font-size:12px;color:var(--text-secondary)}
    .btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--orange);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
    .btn.green{background:var(--green)}
    .btn.secondary{background:var(--bg-surface);border:1.5px solid var(--bg-border);color:var(--text-secondary)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:8px}.gap8{display:grid;gap:8px}.gap10{display:grid;gap:10px}.gap12{display:grid;gap:12px}
    .badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600}
    .live{background:var(--orange);color:#fff}.open{border:1px solid var(--green);color:var(--green);background:var(--bg-primary)}.done{background:var(--bg-border);color:var(--text-secondary)}
    .tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
    .tab,.chip{padding:7px 10px;border-radius:10px;background:var(--bg-surface);border:1.5px solid var(--bg-border);color:var(--text-secondary);font-size:11px;cursor:pointer}
    .tab.active,.chip.active{border-color:var(--orange);color:var(--orange);background:var(--bg-primary)}
    .fade{animation:fadeIn .35s ease}
    @keyframes fadeIn{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    input,select,textarea{width:100%;padding:10px 12px;background:var(--bg-surface);border:1.5px solid var(--bg-border);border-radius:10px;color:#fff;font-size:12px;font-family:'Poppins',sans-serif}
    input::placeholder,textarea::placeholder{color:var(--text-muted)}
    .nav{position:absolute;left:10px;right:10px;bottom:10px;height:64px;border:1.5px solid #1E3260;border-radius:18px;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#132554 0%,#0F2048 100%);box-shadow:0 10px 24px rgba(0,0,0,.28)}.nav-item{flex:1;background:transparent;border:none;color:#4A5C7A;display:grid;justify-items:center;gap:3px;font-size:9px;font-weight:500;cursor:pointer;padding:3px 0}.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav-item.active{color:#F57C00}.nav-item.active svg{filter:drop-shadow(0 0 6px rgba(245,124,0,.35))}
    .avatar{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:8px;font-weight:700}
    .progress{height:3px;background:var(--bg-primary);border-radius:2px;overflow:hidden}.fill{height:100%;background:var(--orange)}.ic{width:12px;height:12px;display:inline-block;vertical-align:-2px;margin-right:4px;color:#F57C00}.rank-badge{display:inline-block;min-width:22px;padding:1px 6px;border-radius:10px;font-size:9px;font-weight:700;color:#fff;margin-right:6px;text-align:center}.rank-badge.gold{background:#EF9F27}.rank-badge.silver{background:#378ADD}.rank-badge.bronze{background:#D85A30}
    .top-tools{display:flex;align-items:center;gap:8px}
    .notify-btn{width:28px;height:28px;border-radius:8px;border:1.5px solid #1E3260;background:#162448;display:grid;place-items:center}
    .notify-btn .ic{width:14px;height:14px;margin:0;vertical-align:0}
    .notify-dot{width:9px;height:9px;background:#F57C00;border-radius:50%}
    .team-strip{display:flex;align-items:center;gap:6px;margin-bottom:8px}
</style></head><body><div class='phone'><div class='status'><span>9:41</span><span>●●●</span></div><div class='content'>
<div class='gap10'>
  <div class='row'><div><div class='sub'>Bom dia,</div><div class='title'>Gonçalo Teixeira</div></div><div class='top-tools'><div class='notify-btn'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><path d='M6 16h12l-1.5-2.2V10a4.5 4.5 0 10-9 0v3.8z' fill='none' stroke='currentColor' stroke-width='2'/><path d='M10 18a2 2 0 004 0' stroke='currentColor' stroke-width='2' stroke-linecap='round'/></svg></div><span class='notify-dot'></span></div></div>
  <div class='row'><div class='card' style='flex:1'><div class='sub'>Os meus torneios</div><div style='font-size:24px;font-weight:700'>4</div><div class='sub'>2 ativos</div></div><div class='card' style='flex:1'><div class='sub'>Golos esta época</div><div style='font-size:24px;font-weight:700'>18</div><div class='sub'>+3 esta semana</div></div></div>
  <div class='sub' style='font-weight:600;color:#F57C00'>JOGOS</div>
  <div class='card' style='border-color:#F57C00'><div class='row'><span class='badge live'>AO VIVO</span><span class='sub'>47' · Campo da Várzea</span></div><div class='row'><b>FC Malcata</b><b>2 — 1</b><b>Os Putos</b></div></div>
  <div class='card'><div class='sub'>Próximo jogo</div><div class='row'><b>Turbo FC</b><span>vs</span><b>Super Raia</b></div></div>
  <div class='sub' style='font-weight:600;color:#F57C00'>OS MEUS TORNEIOS</div>
  <div class='card'><div class='row'><b>Torneio Verão 2025</b><span class='badge live'>A decorrer</span></div><div class='row'><div class='team-strip'><span class='avatar' style='background:#E84C3D'>FM</span><span class='avatar' style='background:#2ECC71'>OP</span><span class='avatar' style='background:#3498DB'>TF</span><span class='avatar' style='background:#E67E22'>SR</span><span class='avatar' style='background:#1E3260;color:#8A9BB8'>+4</span></div><span class='sub'>Viana</span></div><div class='progress' style='margin-top:2px'><div class='fill' style='width:58%'></div></div></div>
</div>
</div><div class='nav'><button class='nav-item active' onclick="sendPrompt('mockup_04_dashboard_jogador.html')"><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M3 10.5L12 4l9 6.5'></path><path d='M6 9.5V20h12V9.5'></path></svg><span>Início</span></button><button class='nav-item' onclick="sendPrompt('mockup_06_lista_torneios.html')"><svg viewBox='0 0 24 24' aria-hidden='true'><rect x='4' y='5' width='16' height='15' rx='2'></rect><path d='M8 3v4M16 3v4M4 10h16'></path></svg><span>Torneios</span></button><button class='nav-item' onclick="sendPrompt('mockup_12_rankings.html')"><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M5 19V10'></path><path d='M12 19V6'></path><path d='M19 19v-8'></path></svg><span>Rankings</span></button><button class='nav-item' onclick="sendPrompt('mockup_14_perfil_utilizador.html')"><svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='8' r='3.5'></circle><path d='M5 20a7 7 0 0114 0'></path></svg><span>Perfil</span></button></div></div>
<script>
function sendPrompt(target){ if(target) location.href = target; }
document.querySelectorAll('.tabs').forEach(group=>{
  group.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{
    group.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const panelId=tab.dataset.panel; if(!panelId) return;
    const wrap=group.parentElement.querySelector('.tab-panels');
    if(!wrap) return;
    wrap.querySelectorAll('[data-tab]').forEach(p=>p.style.display='none');
    const panel=wrap.querySelector('[data-tab="'+panelId+'"]');
    if(panel){panel.style.display='block';panel.classList.remove('fade');void panel.offsetWidth;panel.classList.add('fade');}
  });
});
document.querySelectorAll('.chips').forEach(group=>{
  group.querySelectorAll('.chip').forEach(chip=>chip.onclick=()=>{
    group.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
  });
});
</script>
</body></html>
